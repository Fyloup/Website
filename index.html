    <script>
      // GitHub Pages SPA fallback: restore the path 404.html encoded into ?p=
      (function () {
        var search = window.location.search
        if (search[1] === 'p' && search[2] === '=') {
          var decoded = search
            .slice(3)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            '',
            window.location.pathname.slice(0, -1) + decoded.shift() +
              (decoded.length ? '?' + decoded.join('&') : '') +
              window.location.hash
          )
        }
      })()
    </script>
