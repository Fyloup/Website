      <stop offset="0%" stop-color="#5b6ff0"/>
      <stop offset="45%" stop-color="#2a3a72" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="10%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#7fdcff"/>
      <stop offset="50%" stop-color="#1c6c8c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="11" height="11" patternUnits="userSpaceOnUse">
